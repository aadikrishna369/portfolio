<script src="../script.js"></script>
<script src="blog-data.js"></script>
<script>
// ============================================================================
// PAGINATION — 10 posts per page, driven by ?page= in the URL.
// ============================================================================
(function () {
  const grid = document.getElementById('allBlogsGrid');
  const pager = document.getElementById('blogsPager');
  const perPage = 10;

  const params = new URLSearchParams(window.location.search);
  let page = parseInt(params.get('page'), 10);
  if (!page || page < 1) page = 1;

  const totalPages = Math.max(1, Math.ceil(blogPosts.length / perPage));
  if (page > totalPages) page = totalPages;

  const start = (page - 1) * perPage;
  const pagePosts = blogPosts.slice(start, start + perPage);

  if (pagePosts.length === 0) {
    grid.innerHTML = '<p class="all-blogs-empty">No posts yet — check back soon.</p>';
  } else {
    grid.innerHTML = pagePosts.map(p => `
      <article class="blog-card fade-up in-view">
        <a href="${p.url}" class="blog-card-media">
          <img src="${p.banner}" alt="" loading="lazy">
          <span class="blog-card-tag">${p.category}</span>
        </a>
        <div class="blog-card-body">
          <div class="blog-meta"><span>${p.date}</span><span class="blog-meta-dot">&bull;</span><span>${p.readTime}</span></div>
          <h3><a href="${p.url}">${p.title}</a></h3>
          <p>${p.excerpt}</p>
          <a href="${p.url}" class="project-link">Read post</a>
        </div>
      </article>
    `).join('');
  }

  if (totalPages > 1) {
    const prevDisabled = page <= 1;
    const nextDisabled = page >= totalPages;
    pager.innerHTML = `
      <a href="?page=${page - 1}" class="btn btn-outline magnetic pager-btn${prevDisabled ? ' disabled' : ''}" ${prevDisabled ? 'aria-disabled="true" tabindex="-1"' : ''}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m0 0l7 7m-7-7l7-7"/></svg>
        <span>Prev</span>
      </a>
      <span class="pager-status">Page ${page} of ${totalPages}</span>
      <a href="?page=${page + 1}" class="btn btn-outline magnetic pager-btn${nextDisabled ? ' disabled' : ''}" ${nextDisabled ? 'aria-disabled="true" tabindex="-1"' : ''}>
        <span>Next</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m0 0l-6-6m6 6l-6 6"/></svg>
      </a>
    `;
  }
})();
</script>
</body>
