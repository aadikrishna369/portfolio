<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Abstract night-city skyline banner</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="70%" stop-color="#0c0e13"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#67D9FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#67D9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- moon -->
  <circle cx="900" cy="80" r="34" fill="#67D9FF" opacity="0.18"/>
  <circle cx="900" cy="80" r="22" fill="#e8f6ff" opacity="0.55"/>

  <!-- distant skyline -->
  <g fill="#11151d">
    <rect x="0" y="230" width="60" height="170"/>
    <rect x="70" y="180" width="45" height="220"/>
    <rect x="125" y="250" width="70" height="150"/>
    <rect x="205" y="150" width="50" height="250"/>
    <rect x="265" y="210" width="90" height="190"/>
    <rect x="365" y="120" width="40" height="280"/>
    <rect x="415" y="260" width="80" height="140"/>
    <rect x="505" y="170" width="55" height="230"/>
    <rect x="570" y="240" width="65" height="160"/>
    <rect x="645" y="140" width="45" height="260"/>
    <rect x="700" y="200" width="100" height="200"/>
    <rect x="810" y="230" width="60" height="170"/>
    <rect x="880" y="160" width="50" height="240"/>
    <rect x="940" y="260" width="90" height="140"/>
    <rect x="1040" y="180" width="55" height="220"/>
    <rect x="1105" y="230" width="95" height="170"/>
  </g>

  <!-- lit windows -->
  <g fill="#67D9FF" opacity="0.55">
    <rect x="18" y="255" width="6" height="8"/>
    <rect x="34" y="280" width="6" height="8"/>
    <rect x="86" y="200" width="6" height="8"/>
    <rect x="86" y="230" width="6" height="8"/>
    <rect x="140" y="275" width="6" height="8"/>
    <rect x="220" y="175" width="6" height="8"/>
    <rect x="220" y="210" width="6" height="8"/>
    <rect x="285" y="235" width="6" height="8"/>
    <rect x="310" y="260" width="6" height="8"/>
    <rect x="380" y="150" width="6" height="8"/>
    <rect x="380" y="190" width="6" height="8"/>
    <rect x="430" y="285" width="6" height="8"/>
    <rect x="520" y="195" width="6" height="8"/>
    <rect x="585" y="265" width="6" height="8"/>
    <rect x="660" y="165" width="6" height="8"/>
    <rect x="720" y="225" width="6" height="8"/>
    <rect x="755" y="250" width="6" height="8"/>
    <rect x="825" y="255" width="6" height="8"/>
    <rect x="895" y="185" width="6" height="8"/>
    <rect x="955" y="285" width="6" height="8"/>
    <rect x="1055" y="205" width="6" height="8"/>
    <rect x="1120" y="255" width="6" height="8"/>
    <rect x="1150" y="280" width="6" height="8"/>
  </g>

  <!-- rooftop parkour line motif -->
  <polyline points="0,340 90,300 170,335 260,270 340,320 430,255 520,300 610,260 700,310 790,265 880,315 970,270 1060,305 1150,260 1200,290"
    fill="none" stroke="#67D9FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" stroke-dasharray="1 10"/>

  <rect width="1200" height="400" fill="url(#fade)"/>
</svg>
